<style>

main{max-width:790px;margin:auto;padding:24px 14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;color:white;margin-bottom:20px;font-weight:800}

h1,h2,p{margin:0}
h1{font-size:clamp(35px,8vw,70px);line-height:1.01;letter-spacing:-.055em;margin:14px 0}
h2{font-size:clamp(23px,5vw,34px);line-height:1.15;margin:8px 0 15px}
.subtitle{font-weight:900;font-size:clamp(20px,4.5vw,30px);line-height:1.15;text-transform:uppercase}
.badge{display:inline-block;background:#fbd938;color:#21104d;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:900}
.cover-bottom{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:850;font-size:14px}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:850;border:2px solid #21104d;border-radius:12px;padding:11px 13px;min-height:48px;cursor:pointer;color:#21104d;background:#fff;box-shadow:0 3px 0 #21104d}

.choice.bad{color:#59051a;background:#ff7791;box-shadow:0 0 18px #ff315f,inset 0 0 0 2px #fff}
.result{margin-top:20px;padding:17px;border-left:7px solid;border-radius:13px;line-height:1.6;font-size:17px}

.stat:first-child{background:#bdffda}.stat:nth-child(2){background:#ffcedb}
.small{color:#4a3e68;font-size:14px;line-height:1.5}

<script>
const questions = [["E", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3830914\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - Esp GT (TELEBRAS)/TELEBRAS/Analista Superior/Finanças/2026\u003c/a>\u003c/p>\u003cp>Considerando os pronunciamentos técnicos do Comitê de Pronunciamentos Contábeis (CPC), julgue o item seguinte.\u003c/p>\u003cp>Obrigação presente que resulta de eventos passados, mas que não é reconhecida pelo fato de não ser possível a mensuração de seu valor com suficiente confiabilidade, não deve ser tratada contabilmente como um passivo contingente.\u003c/p>", "\u003cp>A situação descrita é expressamente abrangida pelo conceito de \u003cb>passivo contingente\u003c/b> do item \u003cb>10(b)(ii)\u003c/b>. O evento passado já criou uma obrigação presente. O que impede a provisão é a falta de uma estimativa suficientemente confiável. O item \u003cb>26\u003c/b> trata essa impossibilidade como extremamente rara e remete à divulgação do passivo contingente, observada a regra do item \u003cb>28\u003c/b> sobre saída remota.\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3831189\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - Esp GT (TELEBRAS)/TELEBRAS/Contador/2026\u003c/a>\u003c/p>\u003cp>Com base no Pronunciamento Técnico CPC 25 – Provisões, passivos contingentes e ativos contingentes, no Pronunciamento Técnico CPC 47 – Receita de contrato com cliente e no Pronunciamento Técnico CPC 48 – Instrumentos financeiros, julgue o item subsequente.\u003c/p>\u003cp>Os passivos que não satisfizerem aos critérios de reconhecimento contábil deverão ser considerados passivos contingentes, de acordo com o Pronunciamento Técnico CPC 25.\u003c/p>", "\u003cp>O gabarito se baseia no item \u003cb>12(b)\u003c/b>. Dentro do alcance do CPC 25, a expressão \u003cem>passivo contingente\u003c/em> abrange obrigações que ficam fora do balanço porque a existência da obrigação presente ainda precisa ser confirmada ou porque uma obrigação presente falha no critério de saída provável ou de mensuração confiável. Leia a expressão \u003cem>de acordo com o CPC 25\u003c/em> como uma delimitação. O enunciado trata das obrigações e contingências abrangidas pelo pronunciamento.\u003c/p>"], ["E", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3965157\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - Ana Adm (TCE RN)/TCE RN/Ciências Contábeis/2026\u003c/a>\u003c/p>\u003cp>A respeito da mensuração de ativos e de passivos, da redução ao valor recuperável, de reavaliação, de provisões, de passivos contingentes e do tratamento contábil aplicável a impostos e contribuições, julgue o item subsequente.\u003c/p>\u003cp>Passivos contingentes devem ser reconhecidos no passivo sempre que houver risco possível, ainda que não haja obrigação presente confirmada.\u003c/p>", "\u003cp>A assertiva transforma a situação típica de divulgação em situação de reconhecimento. Uma \u003cb>obrigação possível\u003c/b> decorrente de evento passado, cuja existência ainda depende de confirmação, enquadra-se no item \u003cb>10(a)\u003c/b>. Com possibilidade de saída de recursos acima de remota, a entidade divulga a contingência em nota explicativa. O item \u003cb>27\u003c/b> veda o reconhecimento de passivo contingente.\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3965163\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - Ana Adm (TCE RN)/TCE RN/Ciências Contábeis/2026\u003c/a>\u003c/p>\u003cp>A respeito da mensuração de ativos e de passivos, da redução ao valor recuperável, de reavaliação, de provisões, de passivos contingentes e do tratamento contábil aplicável a impostos e contribuições, julgue o item subsequente.\u003c/p>\u003cp>Provisões são passivos de prazo ou valor incerto reconhecidos quando há obrigação presente e estimativa confiável do desembolso.\u003c/p>", "\u003cp>O item \u003cb>10\u003c/b> define provisão como passivo de prazo ou valor incerto. Obrigação presente e estimativa confiável, mencionadas na questão, são condições exigidas. A banca aceitou a descrição, que apresenta condições verdadeiras sem afirmar que sejam suficientes por si sós. Para memorizar a regra completa do item \u003cb>14\u003c/b>, acrescente a \u003cb>saída provável de recursos\u003c/b> e lembre que a obrigação presente decorre de \u003cb>evento passado\u003c/b>.\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/4023729\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - Prof NS (ANSA)/ANSA/Contabilidade/2026\u003c/a>\u003c/p>\u003cp>O item a seguir, é apresentada uma situação hipotética seguida de uma assertiva a ser julgada com base nas normas emitidas pelo Comitê de Pronunciamentos Contábeis (CPC) e nas disposições da Lei n.º 6.404/1976.\u003c/p>\u003cp>Uma sociedade anônima regulada pela Comissão de Valores Mobiliários (CVM) provisionou R$ 5 milhões em 31/12/2025, por litígio trabalhista provável, considerando laudo pericial contábil com estimativa do pagamento em 18 parcelas mensais e sucessivas; além disso, levou ao resultado do exercício passivo contingente remanescente de R$ 2 milhões como despesa, sem divulgação em notas explicativas. Nesse caso, a contabilização do passivo contingente como despesa descumpriu os critérios de reconhecimento de provisões.\u003c/p>", "\u003cp>A questão informa dois componentes. O litígio provável, com obrigação presente e estimativa confiável, admite provisão. A parcela de \u003cb>R$ 2 milhões\u003c/b>, expressamente classificada como passivo contingente, fica fora do balanço e do resultado. Se a possibilidade de saída for superior a remota, essa parcela deve ser divulgada em nota.\u003c/p>\u003cp>O pagamento em 18 parcelas exige avaliar se o efeito financeiro é material. Se for, calcula-se o valor presente dos desembolsos. A duração do parcelamento, por si só, não permite calcular o ajuste. \u003cb>CPC 25, itens 14, 27, 28 e 45 a 47.\u003c/b>\u003c/p>"], ["E", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/4145408\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - AAD (UNEAL)/UNEAL/Ciências Contábeis/2026\u003c/a>\u003c/p>\u003cp>Acerca da mensuração de ativos e passivos nas demonstrações contábeis, das provisões, passivos contingentes e ativos contingentes, estoques e imobilizado, julgue o item subsequente.\u003c/p>\u003cp>A indenização de terceiros relativa a item do ativo imobilizado extraviado ou que tenha sofrido redução ao valor recuperável é compensada contabilmente com a perda reconhecida anteriormente, por se tratar de mesmo evento econômico.\u003c/p>", "\u003cp>A norma específica é o \u003cb>CPC 27, itens 65 e 66\u003c/b>. Primeiro, registra-se a desvalorização ou a baixa do bem, conforme o fato ocorrido. A indenização de terceiro entra no resultado quando se torna recebível.\u003c/p>\u003cp>Por exemplo, se uma máquina extraviada tiver valor contábil de R$ 100 mil e a seguradora passar a dever R$ 70 mil, a entidade registra a perda de R$ 100 mil e, separadamente, a indenização de R$ 70 mil. O efeito líquido no resultado pode ser de \u003cb>R$ 30 mil negativos\u003c/b>, mas os fatos são contabilizados separadamente.\u003c/p>"], ["E", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/4145410\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - AAD (UNEAL)/UNEAL/Ciências Contábeis/2026\u003c/a>\u003c/p>\u003cp>Acerca da mensuração de ativos e passivos nas demonstrações contábeis, das provisões, passivos contingentes e ativos contingentes, estoques e imobilizado, julgue o item subsequente.\u003c/p>\u003cp>As perdas decorrentes de atividades operacionais futuras são reconhecidas como provisões quando estimáveis com confiabilidade, ainda que inexistente obrigação presente da entidade na data das demonstrações contábeis.\u003c/p>", "\u003cp>Uma previsão confiável de prejuízo para o próximo exercício não cria obrigação presente na data do balanço. A entidade pode, por exemplo, mudar a forma de operar ou descontinuar a atividade. Os itens \u003cb>63 a 65\u003c/b> vedam a provisão para perdas operacionais futuras. A expectativa de prejuízos pode, contudo, ser um indício de que ativos da operação precisam passar por teste de recuperabilidade conforme o \u003cb>CPC 01\u003c/b>.\u003c/p>"], ["E", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3251793\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - AJ TRF6/TRF 6/Apoio Especializado/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>A seguir, apresenta-se o balancete de verificação de uma sociedade anônima aberta do setor de varejo, que deseja participar de processos licitatórios. Atualmente, essas são todas as contas patrimoniais da empresa, que estão apresentadas em ordem alfabética, com os respectivos saldos em módulo e em reais.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">contas\u003c/th>\u003cth scope=\"col\">saldos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ações em tesouraria\u003c/td>\u003ctd>500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>caixa\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>capital social\u003c/td>\u003ctd>3.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>clientes\u003c/td>\u003ctd>600\u003c/td>\u003c/tr>\u003ctr>\u003ctd>contas a pagar em 3 anos\u003c/td>\u003ctd>1.500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>contas a receber em 1.000 dias\u003c/td>\u003ctd>2.500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>depreciação acumulada\u003c/td>\u003ctd>200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>estoques\u003c/td>\u003ctd>500\u003c/td>\u003c/tr>\u003ctr>\u003ctd>fornecedores\u003c/td>\u003ctd>200\u003c/td>\u003c/tr>\u003ctr>\u003ctd>impostos a recolher\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>máquinas\u003c/td>\u003ctd>700\u003c/td>\u003c/tr>\u003ctr>\u003ctd>provisões cíveis\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>\u003ctr>\u003ctd>reserva legal\u003c/td>\u003ctd>600\u003c/td>\u003c/tr>\u003ctr>\u003ctd>terrenos\u003c/td>\u003ctd>800\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Com base nessas informações e no balancete hipotético precedente, julgue o item a seguir.\u003c/p>\u003cp>A conta provisões cíveis engloba os processos cíveis cuja perda e consequente saída de recursos tenham sido classificadas pela empresa como prováveis ou possíveis.\u003c/p>", "\u003cp>A conta \u003cb>Provisões cíveis\u003c/b>, com saldo de \u003cb>R$ 100\u003c/b>, é patrimonial e reúne valores reconhecidos por obrigações presentes com saída provável e mensuração confiável. Processos com perda \u003cb>possível\u003c/b> ficam fora dessa conta e são divulgados como passivos contingentes, observadas as regras de divulgação. O balancete informa o saldo registrado. Ele não permite calcular quanto existe em contingências apenas divulgadas. \u003cb>Itens 14, 27 e 28.\u003c/b>\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3293539\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - APC (FUNPRESP-EXE)/FUNPRESP-EXE/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>Julgue o item a seguir, que versam sobre o registro de transações pelo sistema contábil das entidades em geral.\u003c/p>\u003cp>As provisões que indiquem uma provável saída de recursos que incorporam benefícios econômicos devem ser reconhecidas a débito de uma conta de despesa e a crédito de uma conta de passivo.\u003c/p>", "\u003cp>Esse é o lançamento usual quando a obrigação deve afetar o resultado, como em uma provisão por litígio da própria entidade. Consideram-se atendidos os demais requisitos do item \u003cb>14\u003c/b>.\u003c/p>\u003cp>\u003cb>Débito:\u003c/b> Despesa com litígio. \u003cb>Crédito:\u003c/b> Provisão para litígio, no passivo.\u003c/p>\u003cp>Há casos em que a contrapartida integra o custo de um ativo por força de norma específica. Um exemplo é a estimativa inicial de desmontagem e restauração do local vinculada a um imobilizado, nas condições do \u003cb>CPC 27, item 16(c)\u003c/b>. A constituição de uma provisão não determina, sozinha, a conta de débito.\u003c/p>"], ["E", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3293542\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - APC (FUNPRESP-EXE)/FUNPRESP-EXE/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>Julgue o item a seguir, que versam sobre o registro de transações pelo sistema contábil das entidades em geral.\u003c/p>\u003cp>Um ativo contingente cuja entrada de benefícios econômicos é tida como provável deve ser reconhecido contabilmente a débito de uma conta específica do ativo e a crédito de uma conta de receita.\u003c/p>", "\u003cp>É prematuro debitar o ativo e creditar receita. Enquanto a entrada de benefícios for \u003cb>provável\u003c/b>, divulga-se o ativo contingente em nota explicativa. Quando a entrada se tornar \u003cb>praticamente certa\u003c/b>, a entidade reconhece o ativo no período em que ocorrer essa mudança de avaliação, com a contrapartida cabível. \u003cb>Itens 31 a 35 e 89.\u003c/b>\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3293549\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - APC (FUNPRESP-EXE)/FUNPRESP-EXE/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>Ainda sobre o registro de transações pelo sistema contábil da entidades em geral, julgue o item que se segue.\u003c/p>\u003cp>Uma condição indispensável para o reconhecimento contábil de uma provisão que represente uma obrigação presente considerada provável é a possibilidade de se fazer uma estimativa confiável do valor dessa obrigação.\u003c/p>", "\u003cp>A entidade pode ter obrigação presente e alta probabilidade de pagamento. Mesmo assim, se não conseguir estimar o valor com suficiente confiabilidade, falta um dos requisitos cumulativos do item \u003cb>14(c)\u003c/b>. O item \u003cb>25\u003c/b> esclarece que estimar é parte normal da elaboração das demonstrações contábeis. A entidade pode trabalhar com uma faixa de resultados possíveis e chegar a uma estimativa confiável sem conhecer antecipadamente o desembolso exato.\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3293570\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - APC (FUNPRESP-EXE)/FUNPRESP-EXE/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>O departamento jurídico de determinada empresa prevê a perda de uma disputa judicial em que a organização é ré, o que implicará o pagamento de R$ 250 milhões (estimativa confiável e material). Segundo ainda o departamento jurídico, caso essa previsão se confirme, o efetivo pagamento terá prazo incerto, pois depende do trâmite da ação no Judiciário.\u003c/p>\u003cp>Considerando que a situação hipotética precedente configura, conforme a NBC TG 25 (R2), um passivo contingente com mensuração confiável, julgue o próximo item.\u003c/p>\u003cp>A empresa não deve reconhecer uma provisão nem a despesa correspondente em suas demonstrações contábeis,cabendo-lhe somente divulgar um passivo contingente em nota explicativa, incluindo o seu saldo.\u003c/p>", "\u003cp>O comando manda considerar que o caso \u003cb>configura passivo contingente\u003c/b>. Aceita essa premissa, não há provisão nem despesa. Em nota explicativa, cabe informar a natureza da contingência e, quando praticável, seu efeito financeiro estimado de \u003cb>R$ 250 milhões\u003c/b>, observada a exceção de saída remota. Nesse contexto, \u003cem>saldo\u003c/em> é o valor estimado divulgado, sem saldo em conta patrimonial.\u003c/p>\u003cp>Se a questão tivesse pedido para \u003cb>classificar\u003c/b> a situação do zero, obrigação presente, saída provável e estimativa confiável levariam à provisão. A incerteza sobre a data de pagamento é compatível com essa classificação. \u003cb>Itens 14, 27, 28 e 86.\u003c/b>\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3293574\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - APC (FUNPRESP-EXE)/FUNPRESP-EXE/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>Determinada empresa respondia por diversos processos judiciais em 31/12/2024, sendo os prazos incertos. Na tabela a seguir, são detalhados a natureza dos referidos processos, a probabilidade de saída de recursos, a mensuração e o valor estimado.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">natureza do processo\u003c/th>\u003cth scope=\"col\">probabilidade de saída de recursos\u003c/th>\u003cth scope=\"col\">estimativa da mensuração\u003c/th>\u003cth scope=\"col\">valor estimado (R$)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>garantias\u003c/td>\u003ctd>possível\u003c/td>\u003ctd>confiável\u003c/td>\u003ctd>130.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>trabalhista\u003c/td>\u003ctd>remota\u003c/td>\u003ctd>confiável\u003c/td>\u003ctd>80.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cível\u003c/td>\u003ctd>possível\u003c/td>\u003ctd>confiável\u003c/td>\u003ctd>120.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>fiscal\u003c/td>\u003ctd>provável\u003c/td>\u003ctd>confiável\u003c/td>\u003ctd>500.000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A partir da situação hipotética apresentada, julgue o próximo item.\u003c/p>\u003cp>De acordo com a NBC TG 25, o valor total de passivos contingentes que a empresa deve divulgar em seu balanço patrimonial como provisão é de R$ 500.000.\u003c/p>", "\u003cp>O processo \u003cb>fiscal\u003c/b>, no valor de \u003cb>R$ 500.000\u003c/b>, é o único com saída \u003cb>provável\u003c/b> e estimativa confiável. Assumida a obrigação presente, ele é reconhecido como provisão no passivo. As ações de garantias e cível são contingências divulgáveis. A ação trabalhista, com saída remota, fica fora do reconhecimento e da divulgação obrigatória.\u003c/p>\u003cp>\u003cb>Ressalva de prova.\u003c/b> A banca acertou o \u003cb>valor\u003c/b>, mas a expressão \u003cem>passivos contingentes divulgados no balanço como provisão\u003c/em> mistura dois tratamentos. Na terminologia dos itens \u003cb>12, 14 e 27\u003c/b>, o correto é \u003cb>reconhecer R$ 500.000 de provisão no balanço\u003c/b>. Tomada literalmente, a classificação do item é incorreta.\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3293575\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - APC (FUNPRESP-EXE)/FUNPRESP-EXE/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>Determinada empresa respondia por diversos processos judiciais em 31/12/2024, sendo os prazos incertos. Na tabela a seguir, são detalhados a natureza dos referidos processos, a probabilidade de saída de recursos, a mensuração e o valor estimado.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">natureza do processo\u003c/th>\u003cth scope=\"col\">probabilidade de saída de recursos\u003c/th>\u003cth scope=\"col\">estimativa da mensuração\u003c/th>\u003cth scope=\"col\">valor estimado (R$)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>garantias\u003c/td>\u003ctd>possível\u003c/td>\u003ctd>confiável\u003c/td>\u003ctd>130.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>trabalhista\u003c/td>\u003ctd>remota\u003c/td>\u003ctd>confiável\u003c/td>\u003ctd>80.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cível\u003c/td>\u003ctd>possível\u003c/td>\u003ctd>confiável\u003c/td>\u003ctd>120.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>fiscal\u003c/td>\u003ctd>provável\u003c/td>\u003ctd>confiável\u003c/td>\u003ctd>500.000\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A partir da situação hipotética apresentada, julgue o próximo item.\u003c/p>\u003cp>De acordo com a NBC TG 25, o valor total de passivos contingentes que a empresa deve divulgar em suas notas explicativas é de R$ 250.000.\u003c/p>", "\u003cp>Some apenas as ações com saída \u003cb>possível\u003c/b>. A contingência de garantias é de \u003cb>R$ 130.000\u003c/b> e a cível, de \u003cb>R$ 120.000\u003c/b>. O total divulgado é de \u003cb>R$ 250.000\u003c/b>. Os R$ 80.000 trabalhistas têm saída remota. Os R$ 500.000 fiscais pertencem à provisão reconhecida, que tem suas próprias divulgações. \u003cb>Itens 28 e 84 a 86.\u003c/b>\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3314936\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - AA (ANM)/ANM/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>A respeito da avaliação de ativos e passivos, julgue o item seguinte.\u003c/p>\u003cp>Configura um passivo contingente a situação em que uma obrigação presente, resultante de eventos passados, apresenta como improvável a exigência de sacrifício de recursos que incorporam benefícios econômicos para liquidá-la.\u003c/p>", "\u003cp>O item \u003cb>10(b)(i)\u003c/b> abrange a obrigação presente de evento passado para a qual a saída de recursos não é provável. Assim, uma obrigação pode existir na data do balanço e, ainda assim, ser classificada como passivo contingente. A possibilidade \u003cb>remota\u003c/b> afasta a divulgação exigida pelo item \u003cb>28\u003c/b>.\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3314937\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - AA (ANM)/ANM/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>A respeito da avaliação de ativos e passivos, julgue o item seguinte.\u003c/p>\u003cp>No encerramento de um exercício, uma provisão deve ser reconhecida, pela melhor estimativa dos custos a serem incorridos, quando o órgão deliberativo maior de uma entidade comunica aos clientes e funcionários de determinada unidade comercial o encerramento de atividades dessa unidade a partir do início do exercício seguinte.\u003c/p>", "\u003cp>A comunicação aos clientes e funcionários antes do encerramento do exercício pode gerar \u003cb>expectativa válida\u003c/b> de que a entidade executará o fechamento. É o fundamento da obrigação não formalizada. A regra completa exige um \u003cb>plano formal detalhado\u003c/b> e expectativa válida criada pelo início de sua execução ou pelo anúncio de suas principais características aos afetados. O gabarito pressupõe que a comunicação do caso cumpre essa função. A provisão cobre os gastos diretos, necessariamente decorrentes da reestruturação e desvinculados das atividades em continuidade. \u003cb>Itens 72, 75 e 80 a 81.\u003c/b>\u003c/p>"], ["E", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3314938\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - AA (ANM)/ANM/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>A respeito da avaliação de ativos e passivos, julgue o item seguinte.\u003c/p>\u003cp>Ativos contingentes devem ser reconhecidos quando sua realização for provável.\u003c/p>", "\u003cp>Com realização \u003cb>provável\u003c/b>, divulga-se em nota explicativa. O reconhecimento do ativo ocorre quando a realização se torna \u003cb>praticamente certa\u003c/b>. Exemplo: uma ação de indenização pode ter prognóstico favorável e ainda estar sujeita a reversão relevante. Nesse estágio, a entidade informa a contingência sem antecipar o ganho. \u003cb>Itens 31 a 35.\u003c/b>\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3439868\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - Tec (EMBRAPA)/EMBRAPA/Orçamento e Finanças/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>Julgue o item a seguir, de acordo com a Resolução CFC n.º 1.374/2011, que trata da estrutura conceitual para elaboração e divulgação de relatório contábil-financeiro.\u003c/p>\u003cp>As provisões são passivos cuja mensuração requer a utilização de um grau significativo de estimativa.\u003c/p>", "\u003cp>A questão remete à estrutura conceitual adotada pela Resolução CFC n.º 1.374/2011. A afirmação é compatível com o CPC 25. Como há incerteza quanto ao valor ou ao prazo, a entidade pode precisar estimar cenários, probabilidades, prazos ou custos de liquidação. O item \u003cb>11\u003c/b> distingue provisões de obrigações como contas a pagar e apropriações por competência, que normalmente envolvem menor grau de incerteza. \u003cb>Itens 10, 11, 25 e 36 a 40.\u003c/b>\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3451707\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - TJ (STM)/STM/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>Acerca das peculiaridades relativas a registro, mensuração e evidenciação de itens nas demonstrações financeiras, julgue o item subsequente.\u003c/p>\u003cp>A mensuração de provisões para garantias deve considerar a melhor estimativa dos desembolsos futuros necessários para liquidar a obrigação.\u003c/p>", "\u003cp>Em uma garantia de produtos, a venda com garantia é o evento passado que gera a obrigação. Para um conjunto numeroso de produtos vendidos, avalia-se a probabilidade de saída para \u003cb>o conjunto de obrigações\u003c/b> e, na mensuração, ponderam-se os cenários pelos respectivos pesos.\u003c/p>\u003cp>Exemplo: 80% × R$ 0 + 15% × R$ 100.000 + 5% × R$ 400.000 = R$ 0 + R$ 15.000 + R$ 20.000 = \u003cb>R$ 35.000\u003c/b>. \u003cb>Itens 24, 36 e 39.\u003c/b>\u003c/p>"], ["C", "\u003cp class=\"exam\">\u003ca href=\"https://www.tecconcursos.com.br/questoes/3451731\" target=\"_blank\" rel=\"noopener noreferrer\">CEBRASPE (CESPE) - TJ (STM)/STM/Contabilidade/2025\u003c/a>\u003c/p>\u003cp>No que concerne aos conceitos e às avaliações do passivo exigível, julgue o item que se seguem.\u003c/p>\u003cp>Provisões devem ser descontadas a valor presente quando o efeito do valor do dinheiro no tempo for significativo.\u003c/p>", "\u003cp>O item \u003cb>45\u003c/b> exige o valor presente quando o efeito do dinheiro no tempo é \u003cb>material\u003c/b>. Exemplo didático: um desembolso de R$ 110.000 daqui a um ano, descontado a 10%, tem valor presente de \u003cb>R$ 100.000\u003c/b> (R$ 110.000 ÷ 1,10).\u003c/p>\u003cp>O item \u003cb>47\u003c/b> prevê taxa antes dos tributos, consistente com as avaliações correntes de mercado e com os riscos específicos da obrigação, sem contar duas vezes riscos já considerados nos fluxos. O aumento da provisão pela passagem do tempo é reconhecido como despesa financeira, conforme o item \u003cb>60\u003c/b>.\u003c/p>"]];
const storageKey = "moreira-cpc25-integra-01-20-v1";
const view = document.getElementById("view");
const restartDialog = document.getElementById("restartDialog");
const initial = () => ({ screen:"cover", index:0, answers:[] });
let state = initial();
let storageWorks = true;
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (saved && ["cover","quiz","score"].includes(saved.screen) &&
      Number.isInteger(saved.index) && saved.index >= 0 && saved.index < questions.length &&
      Array.isArray(saved.answers)) {
    state = { ...saved, answers:saved.answers.slice(0, questions.length).map(a => ["C","E"].includes(a) ? a : null) };
  }
  localStorage.setItem(storageKey, JSON.stringify(state));
} catch { storageWorks = false; }
const answerText = value => value === "C" ? "Certo" : "Errado";
const restart = '<button data-action="restart" aria-label="Reiniciar quiz">↻ Reiniciar</button>';
function save() {
  try { localStorage.setItem(storageKey, JSON.stringify(state)); }
  catch { storageWorks = false; }
}
function stats(start, end) {
  let correct = 0, wrong = 0;
  for (let i = start; i < end; i++) {
    if (!state.answers[i]) continue;
    if (state.answers[i] === questions[i][0]) correct++;
    else wrong++;
  }
  const percent = Math.round(100 * correct / (end-start));
  return '<div class="stats"><div class="stat"><b>'+correct+'</b>Acertos</div><div class="stat"><b>'+wrong+'</b>Erros</div><div class="stat"><b>'+percent+'%</b>Aproveitamento</div></div>';
}
function render(action) {
  const i = state.index;
  const [key, question, explanation] = questions[i];
  const answer = state.answers[i];
  const end = i + 1;
  const total = questions.length;
  if (state.screen === "cover") {
    view.innerHTML = '<span class="badge">BANCA CEBRASPE / CESPE</span><h1 tabindex="-1">Super Quiz<br>CPC 25</h1><p class="subtitle">Provisões, passivos contingentes e ativos contingentes</p><div class="cover-bottom"><button class="primary" data-action="next">Começar quiz →</button><p class="small">20 questões de Certo ou Errado · 2 blocos</p></div>';
  } else if (state.screen === "score") {
    const final = end === total;
    view.innerHTML = '<span class="badge">PLACAR</span><h2 tabindex="-1">'+(final ? 'Resultado final' : 'Questões '+(end-9)+' a '+end)+'</h2>'+
      (final ? '<p>Bloco 2 · Questões 11 a 20</p>' : '')+stats(end-10,end)+
      '<p>Acumulado · '+end+' de '+total+' questões</p>'+stats(0,end)+
      '<nav aria-label="Navegação"><button data-action="back">← Voltar</button>'+restart+
      (final ? '' : '<button class="primary" data-action="next">Próximo bloco →</button>')+'</nav>';
  } else {
    const choice = (value, base) => {
      let color = "";
      if (answer && value === key) color = "good";
      if (answer && value === answer && value !== key) color = "bad";
      return '<button class="choice '+base+' '+color+'" data-action="answer" data-value="'+value+'" '+(answer?'disabled':'')+'>'+answerText(value)+(color==="good"?' ✓':color==="bad"?' ✗':'')+'</button>';
    };
    view.innerHTML = '<div class="meta"><span>Questão '+end+' de '+total+'</span><span>Bloco '+Math.ceil(end/10)+' de 2</span></div>'+
      '<progress aria-label="Questões respondidas" value="'+state.answers.filter(Boolean).length+'" max="'+total+'"></progress>'+
      '<div class="question" tabindex="-1">'+question+'</div><div class="choices" aria-label="Alternativas">'+choice("C","")+
      choice("E","alt")+'</div>'+
      (answer ? '<div class="result '+(answer===key?'good':'bad')+'" tabindex="-1"><strong>'+(answer===key?'✓ Você acertou!':'✗ Você errou.')+' Gabarito: '+answerText(key)+'</strong><h3>Resolução detalhada</h3>'+explanation+'</div>' : '')+
      '<nav aria-label="Navegação"><button data-action="back" '+(i===0?'disabled':'')+'>← Voltar</button>'+restart+
      '<button class="primary" data-action="next" '+(!answer?'disabled':'')+'>'+(end%10===0?'Ver placar':'Avançar')+' →</button></nav>';
  }
  if (!storageWorks) view.insertAdjacentHTML("beforeend", '<p class="small" role="status">O navegador bloqueou o armazenamento. Mantenha esta página aberta para preservar o progresso.</p>');
  if (action === "answer") view.querySelector(".result").focus();
  else if (action) view.querySelector("h1,h2,.question").focus();
}
view.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button || button.disabled) return;
  const {action, value} = button.dataset;
  if (action === "restart") { restartDialog.showModal(); return; }
  if (action === "answer") state.answers[state.index] = value;
  if (action === "back") {
    if (state.screen === "score") state.screen = "quiz";
    else state.index = Math.max(0,state.index-1);
  }
  if (action === "next") {
    if (state.screen === "cover") state.screen = "quiz";
    else if (state.screen === "score" && state.index < questions.length-1) {
      state.screen = "quiz";
      state.index++;
    } else if (state.answers[state.index] && (state.index+1)%10===0) state.screen = "score";
    else if (state.answers[state.index]) state.index++;
  }
  save();
  if (action !== "answer") window.scrollTo(0,0);
  render(action);
});
restartDialog.addEventListener("close", () => {
  if (restartDialog.returnValue !== "reset") return;
  restartDialog.returnValue = "";
  state = initial();
  save();
  window.scrollTo(0,0);
  render("reset");
});
render();
</script>
  </html>
